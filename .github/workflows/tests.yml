# Tests de Glaux à chaque envoi sur GitHub, sur Mac et sur Windows :
# l'interface se compile (TypeScript) et les tests Rust passent (calculs, textes, préférences).
# Gratuit sur un dépôt public.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Interface (TypeScript)
        run: npm run build

      - name: Tests Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml
